<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"><title>憤怒鳥：世界分頁版 (By 李御銘)</title>
<style>
*{box-sizing:border-box;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:none}
body{margin:0;padding:0;width:100vw;height:100vh;overflow:hidden;background:#000;font-family:"PingFang TC","Microsoft JhengHei",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center}
#ui-layer{position:fixed;top:10px;width:96%;max-width:800px;display:none;justify-content:space-between;align-items:flex-start;z-index:20;pointer-events:none}
.hud-panel{background:rgba(0,0,0,.65);backdrop-filter:blur(5px);padding:8px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.2);box-shadow:0 4px 15px rgba(0,0,0,.5);pointer-events:auto}
.hud-text{font-size:14px;font-weight:bold;white-space:nowrap;color:#fff;margin-bottom:4px}
.highlight{color:#f1c40f;font-size:16px}
#turn-indicator{padding:4px 10px;border-radius:6px;font-size:13px;margin-top:5px;background:rgba(231,76,60,.9);border:1px solid #fff;text-align:center;display:none}
.btn-group{display:flex;flex-direction:column;gap:8px;pointer-events:auto}
button{padding:8px 16px;border-radius:8px;font-weight:bold;font-size:14px;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,.5);white-space:nowrap;border:none}
button:active{transform:scale(.95)}button:disabled{opacity:.5;cursor:not-allowed}
.btn-fs{background:#8e44ad;color:#fff;border:2px solid #732d91}.btn-shop{background:#f1c40f;color:#333;border:2px solid #d4ac0d}
.btn-restart{background:#e74c3c;color:#fff;border:2px solid #c0392b}.btn-map{background:#3498db;color:#fff;border:2px solid #2980b9}
#game-container{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:linear-gradient(to bottom,#1e3c72,#2a5298);z-index:1;align-items:center;justify-content:center}
canvas{width:100%;max-width:calc(100vh * 2);height:auto;aspect-ratio:2/1;box-shadow:0 0 20px rgba(0,0,0,.8);object-fit:contain}
#map-screen{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);z-index:50;flex-direction:column;align-items:center;padding:20px;overflow-y:auto}
.map-header{width:100%;max-width:600px;display:flex;flex-direction:column;gap:10px;margin-bottom:20px;margin-top:10px;position:sticky;top:0;z-index:60;background:rgba(26,26,46,.95);padding:15px 20px;border-radius:15px}
.map-header-top{display:flex;justify-content:space-between;align-items:center;width:100%}
.map-title{font-size:22px;color:#0ff;font-weight:bold}.map-subtitle{font-size:13px;color:#bdc3c7;margin-top:4px}
.map-coins{font-size:18px;color:#f1c40f;font-weight:bold}.map-nav{display:flex;justify-content:space-between;align-items:center;width:100%}
.nav-btn{background:#34495e;color:#fff;padding:6px 12px;font-size:12px;border-radius:6px}
.level-grid{display:flex;flex-wrap:wrap;gap:15px;justify-content:center;width:100%;max-width:600px;padding-bottom:50px}
.level-btn{width:75px;height:75px;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;font-weight:bold;color:#fff}
.level-locked{background:#34495e;opacity:.7}.level-unlocked{background:#f1c40f;color:#333;border:3px solid #fff}
.level-cleared{background:#2ecc71;border:2px solid #27ae60}.level-num{font-size:12px;margin-top:4px;opacity:.8}
.overlay-base{display:flex;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,.85);z-index:100;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto}
.overlay-box{background:linear-gradient(135deg,#2c3e50,#34495e);padding:30px;border-radius:15px;border:2px solid #f1c40f;text-align:center;color:#fff;min-width:300px;max-width:90%}
.overlay-title{font-size:28px;color:#f1c40f;margin-bottom:10px;font-weight:bold}.overlay-msg{font-size:15px;margin-bottom:25px;color:#bdc3c7;white-space:pre-line}
.overlay-btn{margin:8px 0;padding:14px 20px;border-radius:8px;font-size:16px;font-weight:bold;color:#fff;width:100%}
.btn-green{background:#2ecc71}.btn-yellow{background:#f1c40f;color:#333}.btn-purple{background:#8e44ad}
.shop-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:20px}
.bird-card{background:rgba(0,0,0,.5);border:2px solid #7f8c8d;border-radius:10px;padding:10px;width:105px;display:flex;flex-direction:column;align-items:center}
.b-icon{border-radius:50%;margin-bottom:8px;display:flex;align-items:center;justify-content:center}.b-name{font-weight:bold;font-size:14px;margin-bottom:4px}
.b-desc{font-size:11px;color:#bdc3c7;margin-bottom:10px;height:30px;text-align:center}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>

  <div id="main-menu" class="overlay-base">
    <div class="overlay-box" style="padding:40px 30px">
      <div class="overlay-title" style="font-size:36px">憤怒鳥</div>
      <div class="overlay-msg" style="margin-bottom:30px">選擇你的遊玩模式</div>
      <button class="overlay-btn btn-green" onclick="startGameMode('1p')">👤 單人模式</button>
      <button class="overlay-btn btn-purple" onclick="startGameMode('2p')">👥 雙人合作</button>
      <div style="font-size:14px;color:#bdc3c7;margin-top:25px">作者：李御銘</div>
    </div>
  </div>

  <div id="map-screen">
    <div class="map-header">
      <div class="map-header-top">
        <div><div class="map-title" id="map-title-txt">世界地圖</div><div class="map-subtitle" id="map-subtitle-txt">第 1 世界 (1 - 30 關)</div></div>
        <div class="map-coins">💰 <span id="map-coins-txt">0</span></div>
      </div>
      <div class="map-nav">
        <button class="nav-btn" id="btn-prev-map" onclick="changeMapPage(-1)">◀ 上一頁</button>
        <button class="nav-btn" id="btn-next-map" onclick="changeMapPage(1)">下一頁 ▶</button>
      </div>
    </div>
    <div class="level-grid" id="level-grid"></div>
  </div>

  <div id="ui-layer">
    <div class="hud-panel">
      <div class="hud-text">Lv <span id="lvl-txt" class="highlight">1</span></div>
      <div class="hud-text">💰 <span id="coins-txt" class="highlight">0</span></div>
      <div class="hud-text">🐦 <span id="birds-txt">3</span> | 🐷 <span id="pigs-txt">0</span></div>
      <div id="turn-indicator">🎮 1P 回合</div>
    </div>
    <div class="btn-group">
      <button class="btn-fs" onclick="toggleFullScreen()">📱 全螢幕</button>
      <button class="btn-shop" onclick="openShop()">🛒 鳥店</button>
      <button class="btn-restart" onclick="restartLevel()">重置關卡</button>
      <button class="btn-map" onclick="backToMap()">回地圖</button>
    </div>
  </div>

  <div id="game-container"><canvas id="canvas"></canvas></div>

  <div id="overlay" class="overlay-base" style="display:none">
    <div class="overlay-box">
      <div class="overlay-title" id="overlay-title">標題</div>
      <div class="overlay-msg" id="overlay-msg">內容</div>
      <div id="overlay-btns" style="display:flex;flex-direction:column;gap:8px"></div>
    </div>
  </div>

  <div id="shop-overlay" class="overlay-base" style="display:none">
    <div class="overlay-box" style="max-width:600px">
      <div class="overlay-title">飛鳥商店 (💰 <span id="shop-coins"></span>)</div>
      <div class="shop-grid" id="shop-grid"></div>
      <button class="overlay-btn btn-purple" onclick="closeShop()">離開商店</button>
    </div>
  </div>

  <script>
    const {Engine,Render,Runner,Bodies,Composite,Constraint,Mouse,MouseConstraint,Events,Body,Vector}=Matter;
    const canvas=document.getElementById('canvas');const WIDTH=800;const HEIGHT=400;const MAX_PULL_DISTANCE=130;const LEVELS_PER_MAP=30;
    let engine,render,mouseConstraint;let slingAnchor={x:130,y:280};
    let gameMode='1p';let unlockedLevel=0;let currentLevel=0;let currentMapPage=0;let coins=100;let currentPlayer=1;
    let birdQueue=[];let currentBird=null;let isLaunched=false;let pigs=[],blocks=[],allBirds=[],customConstraints=[];
    let canSkill=false,isLevelTransitioning=false,levelReady=false,spawnTimeout=null;const BIRD_CATEGORY=0x0002;

    const BIRD_TYPES={
      red:{name:'紅鳥',cost:20,color:'#e74c3c',r:14,density:.005,rest:.4,desc:'平衡型/微推進'},
      blue:{name:'藍鳥',cost:15,color:'#3498db',r:10,density:.003,rest:.9,desc:'輕巧/高彈力'},
      yellow:{name:'黃鳥',cost:30,color:'#f1c40f',r:13,density:.008,rest:.2,desc:'高密度/穿透'},
      black:{name:'炸彈黑',cost:50,color:'#2c3e50',r:16,density:.012,rest:.2,desc:'點擊/核爆'},
      big:{name:'大胖紅',cost:60,color:'#8e44ad',r:24,density:.03,rest:.1,desc:'極重/破壞'}
    };

    const LEVEL_DESIGNS=[
      {b:['red','red','red','red'],t:[{x:500,h:2,m:'wood'},{x:650,h:2,m:'wood'}]},
      {b:['red','blue','red','blue'],t:[{x:450,h:3,m:'wood'},{x:580,h:2,m:'stone'},{x:710,h:1,m:'wood'}]},
      {b:['yellow','red','yellow','red'],t:[{x:480,h:1,m:'steel'},{x:620,h:4,m:'wood'}]},
      {b:['black','blue','red','red'],t:[{x:400,h:2,m:'stone'},{x:530,h:3,m:'stone'},{x:660,h:2,m:'stone'}]},
      {b:['big','yellow','red','red'],t:[{x:450,h:4,m:'steel'},{x:650,h:4,m:'steel'}]},
      {b:['blue','yellow','red','red'],cb:(l)=>{createBlock(500,200,150,20,'stone',{isStatic:true});createBlock(450,150,15,80,'wood');createBlock(550,150,15,80,'wood');createBlock(500,100,120,15,'wood');createPig(500,170,15,40+l*10);createBlock(700,280,100,20,'stone',{isStatic:true});createPig(700,250,18,50+l*10);}},
      {b:['black','black','red','red'],cb:(l)=>{let p=Bodies.circle(550,220,15,{isStatic:true,render:{fillStyle:'#7f8c8d'}});let b=Bodies.rectangle(550,220,250,20,{density:.01,frictionAir:.01,render:{fillStyle:'#e67e22'}});let j=Constraint.create({bodyA:p,bodyB:b,stiffness:1,length:0,render:{visible:false}});blocks.push(p,b);customConstraints.push(j);Composite.add(engine.world,[p,b,j]);createBlock(450,330,20,80,'steel');createPig(450,360,18,60+l*10);createBlock(650,330,20,80,'steel');createPig(650,360,18,60+l*10);}},
      {b:['big','black','yellow','red'],cb:(l)=>{createBlock(450,300,30,140,'steel');createBlock(650,300,30,140,'steel');createBlock(550,220,260,25,'steel');createBlock(500,140,20,140,'stone');createBlock(600,140,20,140,'stone');createBlock(550,60,160,20,'stone');createPig(550,320,35,100+l*20);createPig(550,180,20,50+l*10);}}
    ];

    function toggleFullScreen(){if(!document.fullscreenElement){document.documentElement.requestFullscreen().catch(e=>console.log(e));}else{if(document.exitFullscreen)document.exitFullscreen();}}
    function startGameMode(m){gameMode=m;document.getElementById('main-menu').style.display='none';document.getElementById('map-title-txt').textContent=m==='1p'?"單人世界地圖":"雙人世界地圖";currentMapPage=Math.floor(unlockedLevel/LEVELS_PER_MAP);renderMap();document.getElementById('map-screen').style.display='flex';if(!engine)initEngine();}
    function showOverlay(t,m,btns){document.getElementById('overlay-title').textContent=t;document.getElementById('overlay-msg').innerText=m;const c=document.getElementById('overlay-btns');c.innerHTML='';btns.forEach(b=>{const btn=document.createElement('button');btn.className=`overlay-btn ${b.colorClass||'btn-green'}`;btn.textContent=b.text;btn.onclick=()=>{document.getElementById('overlay').style.display='none';b.action();};c.appendChild(btn);});document.getElementById('overlay').style.display='flex';}
    function openShop(){if(isLevelTransitioning&&birdQueue.length===0&&pigs.length===0)return;document.getElementById('overlay').style.display='none';document.getElementById('shop-overlay').style.display='flex';renderShop();}
    function closeShop(){document.getElementById('shop-overlay').style.display='none';if(isLevelTransitioning&&pigs.length>0&&birdQueue.length===0&&isLaunched){showOverlay("💀 彈藥耗盡！",`你們還有 ${coins} 枚金幣，要進商店買鳥逆轉嗎？`,[{text:"🛒 打開鳥店",colorClass:"btn-yellow",action:()=>openShop()},{text:"重新挑戰",colorClass:"btn-restart",action:()=>loadLevel(currentLevel)},{text:"回地圖",colorClass:"btn-map",action:()=>backToMap()}]);}}
    function renderShop(){const g=document.getElementById('shop-grid');g.innerHTML='';document.getElementById('shop-coins').innerText=coins;for(let k in BIRD_TYPES){let b=BIRD_TYPES[k],c=coins>=b.cost;g.innerHTML+=`<div class="bird-card" style="opacity:${c?1:.6}"><div class="b-icon" style="background:${b.color};width:${b.r*2}px;height:${b.r*2}px"></div><div class="b-name">${b.name}</div><div class="b-desc">${b.desc}</div><button class="btn-yellow" style="padding:4px 12px;font-size:13px;margin-top:auto" onclick="buyBird('${k}')" ${c?'':'disabled'}>${b.cost} 💰</button></div>`;}let sc=80,cs=coins>=sc;g.innerHTML+=`<div class="bird-card" style="opacity:${cs?1:.6};border-color:#2ecc71"><div class="b-icon" style="background:#2ecc71;width:30px;height:30px;border-radius:8px;font-size:16px">⏭️</div><div class="b-name">快速過關</div><div class="b-desc">解鎖下一關卡</div><button class="btn-green" style="padding:4px 12px;font-size:13px;margin-top:auto" onclick="buySkipLevel()" ${cs?'':'disabled'}>${sc} 💰</button></div>`;}
    function buyBird(k){let b=BIRD_TYPES[k];if(coins>=b.cost){coins-=b.cost;birdQueue.unshift(k);isLevelTransitioning=false;if(!currentBird||isLaunched){if(spawnTimeout)clearTimeout(spawnTimeout);spawnBird();}updateUI();renderShop();}}
    function buySkipLevel(){if(coins>=80){coins-=80;closeShop();forceWinLevel();}}
    function forceWinLevel(){if(isLevelTransitioning&&pigs.length===0)return;isLevelTransitioning=true;pigs.forEach(p=>Composite.remove(engine.world,p));pigs=[];updateUI();if(currentLevel===unlockedLevel)unlockedLevel++;setTimeout(()=>{let r=20;coins+=r;showOverlay("⏭️ 鈔能力發動！",`使用了快速過關跳過此局！\n\n基礎獎勵: +20 金幣\n總計獲得: ${r} 金幣！`,[{text:"挑戰下一關",colorClass:"btn-green",action:()=>loadLevel(currentLevel+1)},{text:"回地圖",colorClass:"btn-map",action:()=>backToMap()}]);},500);}
    function changeMapPage(d){currentMapPage+=d;renderMap();}
    function renderMap(){document.getElementById('map-coins-txt').textContent=coins;let s=currentMapPage*LEVELS_PER_MAP+1,e=(currentMapPage+1)*LEVELS_PER_MAP;document.getElementById('map-subtitle-txt').textContent=`第 ${currentMapPage+1} 世界 (${s} - ${e} 關)`;let mw=Math.floor(unlockedLevel/LEVELS_PER_MAP);document.getElementById('btn-prev-map').style.visibility=currentMapPage>0?'visible':'hidden';document.getElementById('btn-next-map').style.visibility=currentMapPage<mw?'visible':'hidden';const g=document.getElementById('level-grid');g.innerHTML='';let si=currentMapPage*LEVELS_PER_MAP,ei=si+LEVELS_PER_MAP;for(let i=si;i<ei;i++){const b=document.createElement('div');b.className='level-btn ';const ns=`<div class="level-num">Level ${i+1}</div>`;if(i<unlockedLevel){b.className+='level-cleared';b.innerHTML=`✔️${ns}`;b.onclick=()=>enterLevel(i);}else if(i===unlockedLevel){b.className+='level-unlocked';b.innerHTML=`⭐${ns}`;b.onclick=()=>enterLevel(i);}else{b.className+='level-locked';b.innerHTML=`🔒${ns}`;}g.appendChild(b);}}
    function backToMap(){clearGameWorld();document.getElementById('game-container').style.display='none';document.getElementById('ui-layer').style.display='none';document.getElementById('overlay').style.display='none';currentMapPage=Math.floor(unlockedLevel/LEVELS_PER_MAP);renderMap();document.getElementById('map-screen').style.display='flex';}
    function enterLevel(i){document.getElementById('map-screen').style.display='none';document.getElementById('game-container').style.display='flex';document.getElementById('ui-layer').style.display='flex';loadLevel(i);}
    
    function initEngine(){
      engine=Engine.create({gravity:{x:0,y:1.1}});canvas.width=WIDTH;canvas.height=HEIGHT;
      render=Render.create({canvas:canvas,engine:engine,options:{width:WIDTH,height:HEIGHT,wireframes:false,background:'transparent'}});
      Runner.run(Runner.create(),engine);Render.run(render);
      const ground=Bodies.rectangle(400,370,800,40,{isStatic:true,render:{fillStyle:'#2d3436'}});
      const lw=Bodies.rectangle(-20,200,40,400,{isStatic:true}),rw=Bodies.rectangle(820,200,40,400,{isStatic:true});
      Composite.add(engine.world,[ground,lw,rw]);
      const mouse=Mouse.create(render.canvas);mouseConstraint=MouseConstraint.create(engine,{mouse:mouse,constraint:{stiffness:.1,render:{visible:false}},collisionFilter:{mask:BIRD_CATEGORY}});
      Composite.add(engine.world,mouseConstraint);
      const resize=()=>{Mouse.setScale(mouseConstraint.mouse,{x:WIDTH/canvas.getBoundingClientRect().width,y:HEIGHT/canvas.getBoundingClientRect().height});};
      window.addEventListener('resize',resize);setTimeout(resize,500);
      Events.on(mouseConstraint,'enddrag',(e)=>{if(e.body===currentBird&&!isLaunched&&levelReady){if(Vector.magnitude(Vector.sub(currentBird.position,slingAnchor))>15){isLaunched=true;canSkill=true;if(spawnTimeout)clearTimeout(spawnTimeout);spawnTimeout=setTimeout(spawnNextBird,4000);}}});
      Events.on(engine,'collisionStart',(e)=>{if(!levelReady)return;e.pairs.forEach(p=>{if(!isLaunched&&currentBird&&(p.bodyA===currentBird||p.bodyB===currentBird))return;pigs.forEach(pg=>{if(p.bodyA===pg||p.bodyB===pg){let sa=Vector.magnitude(p.bodyA.velocity),sb=Vector.magnitude(p.bodyB.velocity);if(Math.max(sa,sb)>1.8)pg.hp-=Math.max(sa,sb)*15;}});});});
      canvas.addEventListener('pointerdown',()=>{if(isLaunched&&canSkill&&currentBird&&levelReady){canSkill=false;const pos=currentBird.position;if(currentBird.bType==='black'){Composite.allBodies(engine.world).forEach(b=>{if(!b.isStatic){let d=Vector.magnitude(Vector.sub(b.position,pos));if(d<180&&d>0)Body.applyForce(b,b.position,Vector.mult(Vector.normalise(Vector.sub(b.position,pos)),.3*(1-d/180)));}});currentBird.render.fillStyle='#f1c40f';}else if(currentBird.bType==='yellow'){Body.applyForce(currentBird,pos,Vector.mult(Vector.normalise(currentBird.velocity),.25));}else if(currentBird.bType==='red'){Body.applyForce(currentBird,pos,Vector.mult(Vector.normalise(currentBird.velocity),.08));}}});
      Events.on(engine,'beforeUpdate',()=>{if(currentBird&&!isLaunched){let d=Vector.magnitude(Vector.sub(currentBird.position,slingAnchor));if(d>MAX_PULL_DISTANCE){Body.setPosition(currentBird,Vector.add(slingAnchor,Vector.mult(Vector.normalise(Vector.sub(currentBird.position,slingAnchor)),MAX_PULL_DISTANCE)));Body.setVelocity(currentBird,{x:0,y:0});}}for(let i=pigs.length-1;i>=0;i--){if(pigs[i].hp<=0||pigs[i].position.y>HEIGHT){Composite.remove(engine.world,pigs[i]);pigs.splice(i,1);}}if(document.getElementById('game-container').style.display!=='none'){updateUI();checkLevelRules();}});
    }

    function createBlock(x,y,w,h,t='wood',opt={}){let c=t==='steel'?'#34495e':(t==='stone'?'#95a5a6':'#d35400'),d=t==='steel'?.02:(t==='stone'?.005:.001);let blk=Bodies.rectangle(x,y,w,h,Object.assign({density:d,friction:.5,render:{fillStyle:c,strokeStyle:'#111',lineWidth:1}},opt));blocks.push(blk);Composite.add(engine.world,blk);}
    function createPig(x,y,r,hp=30){let p=Bodies.circle(x,y,r,{density:.001,friction:.3,restitution:.2,render:{fillStyle:'#2ecc71',strokeStyle:'#27ae60',lineWidth:2}});p.hp=hp;pigs.push(p);Composite.add(engine.world,p);}
    function generateLevel(idx){let di=idx%LEVEL_DESIGNS.length,lc=Math.floor(idx/LEVEL_DESIGNS.length),ds=LEVEL_DESIGNS[di];if(ds.cb){ds.cb(lc);}else{ds.t.forEach(tw=>{let cy=350;for(let h=0;h<tw.h;h++){createBlock(tw.x,cy-40,15,80,tw.m);createBlock(tw.x+50,cy-40,15,80,tw.m);createBlock(tw.x+25,cy-85,90,15,tw.m);if(h===tw.h-1||(h%2===0))createPig(tw.x+25,cy-40,14,30+idx*10);cy-=90;}});}let q=[...ds.b];for(let i=0;i<lc;i++)q.push('red');return q;}
    function spawnBird(){if(birdQueue.length===0)return;let k=birdQueue.shift(),bd=BIRD_TYPES[k];isLaunched=false;canSkill=false;currentBird=Bodies.circle(slingAnchor.x,slingAnchor.y,bd.r,{density:bd.density,friction:.2,restitution:bd.rest,collisionFilter:{category:BIRD_CATEGORY},render:{fillStyle:bd.color,strokeStyle:'#ecf0f1',lineWidth:2}});currentBird.bType=k;allBirds.push(currentBird);const sling=Constraint.create({pointA:slingAnchor,bodyB:currentBird,stiffness:.06,length:0,render:{visible:true,strokeStyle:'#aaa',lineWidth:3}});Events.on(engine,'afterUpdate',function rh(){if(isLaunched&&sling.bodyB){if(Vector.magnitude(Vector.sub(currentBird.position,slingAnchor))<15||currentBird.position.x>slingAnchor.x+10){sling.bodyB=null;Composite.remove(engine.world,sling);Events.off(engine,'afterUpdate',rh);}}});Composite.add(engine.world,[currentBird,sling]);}
    function spawnNextBird(){if(pigs.length>0&&birdQueue.length>0&&!isLevelTransitioning){if(gameMode==='2p')currentPlayer=currentPlayer===1?2:1;spawnBird();}}
    function clearGameWorld(){if(spawnTimeout)clearTimeout(spawnTimeout);pigs.forEach(p=>Composite.remove(engine.world,p));blocks.forEach(b=>Composite.remove(engine.world,b));allBirds.forEach(b=>Composite.remove(engine.world,b));customConstraints.forEach(c=>Composite.remove(engine.world,c));pigs=[];blocks=[];allBirds=[];customConstraints=[];}
    function loadLevel(i){isLevelTransitioning=true;levelReady=false;currentLevel=i;currentPlayer=1;clearGameWorld();birdQueue=generateLevel(currentLevel);spawnBird();setTimeout(()=>{isLevelTransitioning=false;levelReady=true;},1000);}
    function checkLevelRules(){if(isLevelTransitioning||!levelReady)return;if(pigs.length===0){isLevelTransitioning=true;if(currentLevel===unlockedLevel)unlockedLevel++;setTimeout(()=>{let bb=birdQueue.length*5,tr=20+bb;coins+=tr;showOverlay(gameMode==='1p'?"🎉 關卡完成！":"🎉 合作無間！過關！",`基礎獎勵: +20 金幣\n節省鳥類: +${bb} 金幣\n總計獲得: ${tr} 金幣！`,[{text:"挑戰下一關",colorClass:"btn-green",action:()=>loadLevel(currentLevel+1)},{text:"回地圖",colorClass:"btn-map",action:()=>backToMap()}]);},1000);}else if(birdQueue.length===0&&isLaunched&&pigs.length>0&&currentBird){if(Vector.magnitude(currentBird.velocity)<.1||currentBird.position.x>WIDTH+100||currentBird.position.y>HEIGHT+50){isLevelTransitioning=true;setTimeout(()=>{if(birdQueue.length>0||!isLaunched){isLevelTransitioning=false;return;}if(pigs.length>0){showOverlay("💀 彈藥耗盡！",`你們還有 ${coins} 枚金幣，要進商店買鳥嗎？`,[{text:"🛒 打開鳥店",colorClass:"btn-yellow",action:()=>openShop()},{text:"重新挑戰",colorClass:"btn-restart",action:()=>loadLevel(currentLevel)},{text:"回地圖",colorClass:"btn-map",action:()=>backToMap()}]);}else{isLevelTransitioning=false;}},1500);}}}
    function restartLevel(){if(!isLevelTransitioning&&levelReady)loadLevel(currentLevel);}
    function updateUI(){document.getElementById('lvl-txt').textContent=currentLevel+1;document.getElementById('birds-txt').textContent=birdQueue.length+(currentBird&&!isLaunched?1:0);document.getElementById('pigs-txt').textContent=pigs.length;document.getElementById('coins-txt').textContent=coins;const ti=document.getElementById('turn-indicator');if(gameMode==='2p'){ti.style.display="block";if(currentPlayer===1){ti.textContent="🎮 1P 回合 (紅)";ti.style.background="rgba(231, 76, 60, 0.9)";}else{ti.textContent="🎮 2P 回合 (藍)";ti.style.background="rgba(52, 152, 219, 0.9)";}}else{ti.style.display="none";}}
  </script>
</body>
</html>
