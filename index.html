<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>憤怒鳥：雙模式完整版 (Main Menu Edition)</title>
  <style>
    * {
      box-sizing: border-box; 
      -webkit-touch-callout: none;
      -webkit-user-select: none; 
      user-select: none; 
      touch-action: none;
    }
    body {
      margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden;
      background: #000; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    
    /* 遊戲內 UI */
    #ui-layer {
      position: fixed; top: 10px; width: 96%; max-width: 800px;
      display: none; justify-content: space-between; align-items: flex-start; z-index: 20;
      pointer-events: none; 
    }
    .hud-panel {
      background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(5px);
      padding: 8px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5); pointer-events: auto; 
    }
    .hud-text { font-size: 14px; font-weight: bold; white-space: nowrap; color: #fff; margin-bottom: 4px;}
    .hud-text:last-child { margin-bottom: 0; }
    .highlight { color: #f1c40f; font-size: 16px;}
    
    #turn-indicator {
      padding: 4px 10px; border-radius: 6px; font-size: 13px; margin-top: 5px;
      background: rgba(231, 76, 60, 0.9); transition: background 0.3s;
      border: 1px solid white; text-align: center; display: none;
    }

    .btn-group { display: flex; flex-direction: column; gap: 8px; pointer-events: auto; }
    button {
      padding: 8px 16px; border-radius: 8px; font-weight: bold; font-size: 14px;
      cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.5); white-space: nowrap; transition: transform 0.1s; border: none;
    }
    button:active { transform: scale(0.95); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-fs { background: #8e44ad; color: white; border: 2px solid #732d91; }
    .btn-shop { background: #f1c40f; color: #333; border: 2px solid #d4ac0d; }
    .btn-restart { background: #e74c3c; color: white; border: 2px solid #c0392b; }
    .btn-map { background: #3498db; color: white; border: 2px solid #2980b9; }
    
    /* 遊戲畫布 */
    #game-container {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(to bottom, #1e3c72, #2a5298); z-index: 1;
      align-items: center; justify-content: center;
    }
    canvas {
      width: 100%; max-width: calc(100vh * 2); height: auto; aspect-ratio: 2 / 1;
      box-shadow: 0 0 20px rgba(0,0,0,0.8); object-fit: contain;
    }

    /* 地圖介面 */
    #map-screen {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460); z-index: 50;
      flex-direction: column; align-items: center; padding: 20px; overflow-y: auto; scroll-behavior: smooth;
    }
    .map-header {
      width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 30px; margin-top: 20px; position: sticky; top: 0; z-index: 60;
      background: rgba(26, 26, 46, 0.9); padding: 10px 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .map-title { font-size: 24px; color: #00ffcc; font-weight: bold; text-shadow: 0 0 10px rgba(0,255,204,0.5); }
    .map-coins { font-size: 18px; color: #f1c40f; font-weight: bold; }
    .level-grid { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; width: 100%; max-width: 600px; padding-bottom: 50px; }
    .level-btn {
      width: 75px; height: 75px; border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 22px; font-weight: bold; color: white; transition: all 0.2s; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }
    .level-locked { background: #34495e; opacity: 0.7; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
    .level-unlocked { background: #f1c40f; color: #333; cursor: pointer; border: 3px solid #fff; animation: pulse 2s infinite; }
    .level-cleared { background: #2ecc71; cursor: pointer; border: 2px solid #27ae60; }
    .level-num { font-size: 12px; margin-top: 4px; opacity: 0.8; }
    @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(241, 196, 15, 0.7); } 50% { transform: scale(1.05); box-shadow: 0 0 0 12px rgba(241, 196, 15, 0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(241, 196, 15, 0); } }

    /* 通用浮動視窗 (Overlay) */
    .overlay-base {
      display: flex; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85); z-index: 100; flex-direction: column; align-items: center; justify-content: center;
      pointer-events: auto;
    }
    .overlay-box {
      background: linear-gradient(135deg, #2c3e50, #34495e); padding: 30px; border-radius: 15px;
      border: 2px solid #f1c40f; text-align: center; box-shadow: 0 0 40px rgba(241, 196, 15, 0.4); color: white; min-width: 300px; max-width: 90%;
    }
    .overlay-title { font-size: 28px; color: #f1c40f; margin-bottom: 10px; font-weight: bold; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    .overlay-msg { font-size: 15px; margin-bottom: 25px; line-height: 1.6; white-space: pre-line; color: #bdc3c7; }
    .overlay-btn { margin: 8px 0; padding: 14px 20px; border:none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; color: white; width: 100%; }
    
    .btn-green { background: #2ecc71; box-shadow: 0 4px #27ae60; } .btn-green:active { transform: translateY(4px); box-shadow: 0 0 #27ae60; }
    .btn-yellow { background: #f1c40f; box-shadow: 0 4px #d4ac0d; color: #333; } .btn-yellow:active { transform: translateY(4px); box-shadow: 0 0 #d4ac0d; }
    .btn-purple { background: #8e44ad; box-shadow: 0 4px #732d91; } .btn-purple:active { transform: translateY(4px); box-shadow: 0 0 #732d91; }
    
    /* 商店專屬 UI */
    .shop-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 20px; }
    .bird-card {
      background: rgba(0,0,0,0.5); border: 2px solid #7f8c8d; border-radius: 10px; padding: 10px;
      width: 105px; display: flex; flex-direction: column; align-items: center; transition: 0.2s;
    }
    .bird-card:active { border-color: #f1c40f; }
    .b-icon { border-radius: 50%; margin-bottom: 8px; box-shadow: inset -2px -2px 5px rgba(0,0,0,0.5); }
    .b-name { font-weight: bold; font-size: 14px; margin-bottom: 4px; }
    .b-desc { font-size: 11px; color: #bdc3c7; margin-bottom: 10px; height: 30px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>

  <!-- 主選單 (一進來看到的畫面) -->
  <div id="main-menu" class="overlay-base">
    <div class="overlay-box" style="padding: 40px 30px;">
      <div class="overlay-title" style="font-size: 36px;">憤怒鳥</div>
      <div class="overlay-msg" style="margin-bottom: 30px;">選擇你的遊玩模式</div>
      <button class="overlay-btn btn-green" onclick="startGameMode('1p')">👤 單人模式</button>
      <button class="overlay-btn btn-purple" onclick="startGameMode('2p')">👥 雙人合作</button>
    </div>
  </div>

  <div id="map-screen">
    <div class="map-header">
      <div class="map-title" id="map-title-txt">世界地圖</div>
      <div class="map-coins">💰 <span id="map-coins-txt">0</span></div>
    </div>
    <div class="level-grid" id="level-grid"></div>
  </div>

  <div id="ui-layer">
    <div class="hud-panel">
      <div class="hud-text">Lv <span id="lvl-txt" class="highlight">1</span></div>
      <div class="hud-text">💰 <span id="coins-txt" class="highlight">0</span></div>
      <div class="hud-text">🐦 <span id="birds-txt">3</span> | 🐷 <span id="pigs-txt">0</span></div>
      <div id="turn-indicator">🎮 1P 回合</div>
    </div>
    <div class="btn-group">
      <button class="btn-fs" onclick="toggleFullScreen()">📱 全螢幕</button>
      <button class="btn-shop" onclick="openShop()">🛒 鳥店</button>
      <button class="btn-restart" onclick="restartLevel()">重置關卡</button>
      <button class="btn-map" onclick="backToMap()">回地圖</button>
    </div>
  </div>

  <div id="game-container"><canvas id="canvas"></canvas></div>

  <!-- 對話與結算框 -->
  <div id="overlay" class="overlay-base" style="display: none;">
    <div class="overlay-box">
      <div class="overlay-title" id="overlay-title">標題</div>
      <div class="overlay-msg" id="overlay-msg">內容</div>
      <div id="overlay-btns" style="display: flex; flex-direction: column; gap: 8px;"></div>
    </div>
  </div>

  <!-- 商店框 -->
  <div id="shop-overlay" class="overlay-base" style="display: none;">
    <div class="overlay-box" style="max-width: 600px;">
      <div class="overlay-title">飛鳥商店 (💰 <span id="shop-coins"></span>)</div>
      <div class="shop-grid" id="shop-grid"></div>
      <button class="overlay-btn btn-purple" onclick="closeShop()">離開商店</button>
    </div>
  </div>

  <script>
    const { Engine, Render, Runner, Bodies, Composite, Constraint, Mouse, MouseConstraint, Events, Body, Vector } = Matter;

    const canvas = document.getElementById('canvas');
    const WIDTH = 800; const HEIGHT = 400;
    const MAX_PULL_DISTANCE = 130; 

    let engine, render, mouseConstraint;
    let slingAnchor = { x: 130, y: 280 };
    
    let gameMode = '1p'; // '1p' 或是 '2p'
    let unlockedLevel = 0; let currentLevel = 0;
    let coins = 20; 
    let currentPlayer = 1; 
    
    let birdQueue = []; 
    let currentBird = null;
    let isLaunched = false;
    let pigs = []; let blocks = []; let allBirds = []; let customConstraints = [];
    
    let canSkill = false;
    let isLevelTransitioning = false; 
    let levelReady = false; 
    let spawnTimeout = null; 
    const BIRD_CATEGORY = 0x0002;

    const BIRD_TYPES = {
      red: { name: '紅鳥', cost: 20, color: '#e74c3c', r: 14, density: 0.005, rest: 0.4, desc: '平衡型 / 微推進' },
      blue: { name: '藍鳥', cost: 15, color: '#3498db', r: 10, density: 0.003, rest: 0.9, desc: '輕巧 / 高彈力' },
      yellow: { name: '黃鳥', cost: 30, color: '#f1c40f', r: 13, density: 0.008, rest: 0.2, desc: '高密度 / 衝刺穿透' },
      black: { name: '炸彈黑', cost: 50, color: '#2c3e50', r: 16, density: 0.012, rest: 0.2, desc: '點擊 / 範圍核爆' },
      big: { name: '大胖紅', cost: 60, color: '#8e44ad', r: 24, density: 0.03, rest: 0.1, desc: '極重 / 物理破壞' }
    };

    const LEVEL_DESIGNS = [
      { baseBirds: ['red','red','red','red'], towers: [ { x: 500, h: 2, mat: 'wood' }, { x: 650, h: 2, mat: 'wood' } ] },
      { baseBirds: ['red','blue','red','blue'], towers: [ { x: 450, h: 3, mat: 'wood' }, { x: 580, h: 2, mat: 'stone' }, { x: 710, h: 1, mat: 'wood' } ] },
      { baseBirds: ['yellow','red','yellow','red'], towers: [ { x: 480, h: 1, mat: 'steel' }, { x: 620, h: 4, mat: 'wood' } ] },
      { baseBirds: ['black','blue','red','red'], towers: [ { x: 400, h: 2, mat: 'stone' }, { x: 530, h: 3, mat: 'stone' }, { x: 660, h: 2, mat: 'stone' } ] },
      { baseBirds: ['big','yellow','red','red'], towers: [ { x: 450, h: 4, mat: 'steel' }, { x: 650, h: 4, mat: 'steel' } ] },
      { baseBirds: ['blue','yellow','red','red'], customBuild: (loopLevel) => {
          createBlock(500, 200, 150, 20, 'stone', { isStatic: true }); 
          createBlock(450, 150, 15, 80, 'wood'); createBlock(550, 150, 15, 80, 'wood'); createBlock(500, 100, 120, 15, 'wood');
          createPig(500, 170, 15, 40 + loopLevel * 10);
          createBlock(700, 280, 100, 20, 'stone', { isStatic: true }); 
          createPig(700, 250, 18, 50 + loopLevel * 10);
      }},
      { baseBirds: ['black','black','red','red'], customBuild: (loopLevel) => {
          let pivot = Bodies.circle(550, 220, 15, { isStatic: true, render: { fillStyle: '#7f8c8d' } });
          let blade = Bodies.rectangle(550, 220, 250, 20, { density: 0.01, frictionAir: 0.01, render: { fillStyle: '#e67e22' } });
          let joint = Constraint.create({ bodyA: pivot, bodyB: blade, stiffness: 1, length: 0, render: { visible: false } });
          blocks.push(pivot, blade); customConstraints.push(joint); Composite.add(engine.world, [pivot, blade, joint]);
          createBlock(450, 330, 20, 80, 'steel'); createPig(450, 360, 18, 60 + loopLevel * 10);
          createBlock(650, 330, 20, 80, 'steel'); createPig(650, 360, 18, 60 + loopLevel * 10);
      }},
      { baseBirds: ['big','black','yellow','red'], customBuild: (loopLevel) => {
          createBlock(450, 300, 30, 140, 'steel'); createBlock(650, 300, 30, 140, 'steel'); createBlock(550, 220, 260, 25, 'steel');
          createBlock(500, 140, 20, 140, 'stone'); createBlock(600, 140, 20, 140, 'stone'); createBlock(550, 60, 160, 20, 'stone');
          createPig(550, 320, 35, 100 + loopLevel * 20); createPig(550, 180, 20, 50 + loopLevel * 10);
      }}
    ];

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => { console.log(err); });
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    // 啟動遊戲入口
    function startGameMode(mode) {
      gameMode = mode;
      document.getElementById('main-menu').style.display = 'none';
      
      let titleTxt = mode === '1p' ? "單人世界地圖" : "雙人世界地圖";
      document.getElementById('map-title-txt').textContent = titleTxt;
      
      renderMap();
      document.getElementById('map-screen').style.display = 'flex';
      
      if (!engine) initEngine();
    }

    function showOverlay(title, msg, buttons) {
      document.getElementById('overlay-title').textContent = title;
      document.getElementById('overlay-msg').innerText = msg;
      const btnContainer = document.getElementById('overlay-btns');
      btnContainer.innerHTML = '';
      buttons.forEach(b => {
        const btn = document.createElement('button');
        btn.className = `overlay-btn ${b.colorClass || 'btn-green'}`;
        btn.textContent = b.text;
        btn.onclick = () => { document.getElementById('overlay').style.display = 'none'; b.action(); };
        btnContainer.appendChild(btn);
      });
      document.getElementById('overlay').style.display = 'flex';
    }

    function openShop() {
      if(isLevelTransitioning && birdQueue.length === 0 && pigs.length === 0) return; 
      document.getElementById('overlay').style.display = 'none'; 
      document.getElementById('shop-overlay').style.display = 'flex';
      renderShop();
    }
    
    function closeShop() {
      document.getElementById('shop-overlay').style.display = 'none';
      if (isLevelTransitioning && pigs.length > 0 && birdQueue.length === 0 && isLaunched) {
          showOverlay("💀 彈藥耗盡！", `你們還有 ${coins} 枚金幣，要進商店買鳥逆轉嗎？`, 
            [ { text: "🛒 打開鳥店", colorClass: "btn-yellow", action: () => openShop() }, 
              { text: "重新挑戰", colorClass: "btn-restart", action: () => loadLevel(currentLevel) }, 
              { text: "回地圖", colorClass: "btn-map", action: () => backToMap() } ]
          );
      }
    }
    
    function renderShop() {
      const grid = document.getElementById('shop-grid');
      grid.innerHTML = '';
      document.getElementById('shop-coins').innerText = coins;
      for(let key in BIRD_TYPES) {
        let b = BIRD_TYPES[key];
        let canBuy = coins >= b.cost;
        grid.innerHTML += `
          <div class="bird-card" style="opacity: ${canBuy ? 1 : 0.6}">
            <div class="b-icon" style="background: ${b.color}; width: ${b.r*2}px; height: ${b.r*2}px;"></div>
            <div class="b-name">${b.name}</div>
            <div class="b-desc">${b.desc}</div>
            <button class="btn-yellow" style="padding: 4px 12px; font-size:13px; margin-top: auto;" onclick="buyBird('${key}')" ${canBuy?'':'disabled'}>${b.cost} 💰</button>
          </div>
        `;
      }
    }
    
    function buyBird(typeKey) {
      let b = BIRD_TYPES[typeKey];
      if (coins >= b.cost) {
        coins -= b.cost;
        birdQueue.unshift(typeKey); 
        isLevelTransitioning = false; 
        if (!currentBird || isLaunched) {
            if (spawnTimeout) clearTimeout(spawnTimeout);
            spawnBird();
        }
        updateUI(); renderShop();
      }
    }

    function renderMap() {
      document.getElementById('map-coins-txt').textContent = coins;
      const grid = document.getElementById('level-grid');
      grid.innerHTML = '';
      const visibleLevels = Math.max(15, unlockedLevel + 6);
      let targetNode = null;

      for (let i = 0; i < visibleLevels; i++) {
        const btn = document.createElement('div');
        btn.className = 'level-btn ';
        const numSpan = `<div class="level-num">Level ${i + 1}</div>`;
        if (i < unlockedLevel) {
          btn.className += 'level-cleared'; btn.innerHTML = `✔️${numSpan}`; btn.onclick = () => enterLevel(i);
        } else if (i === unlockedLevel) {
          btn.className += 'level-unlocked'; btn.innerHTML = `⭐${numSpan}`; btn.onclick = () => enterLevel(i);
          targetNode = btn; 
        } else {
          btn.className += 'level-locked'; btn.innerHTML = `🔒${numSpan}`;
        }
        grid.appendChild(btn);
      }
      if (targetNode) setTimeout(() => { targetNode.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 100);
    }
    
    function backToMap() {
      clearGameWorld();
      document.getElementById('game-container').style.display = 'none';
      document.getElementById('ui-layer').style.display = 'none';
      document.getElementById('overlay').style.display = 'none';
      document.getElementById('map-screen').style.display = 'flex';
      renderMap();
    }
    
    function enterLevel(idx) {
      document.getElementById('map-screen').style.display = 'none';
      document.getElementById('game-container').style.display = 'flex'; 
      document.getElementById('ui-layer').style.display = 'flex';
      loadLevel(idx);
    }

    function initEngine() {
      engine = Engine.create({ gravity: { x: 0, y: 1.1 } }); 
      canvas.width = WIDTH; canvas.height = HEIGHT;
      render = Render.create({ canvas: canvas, engine: engine, options: { width: WIDTH, height: HEIGHT, wireframes: false, background: 'transparent' } });
      Runner.run(Runner.create(), engine); Render.run(render);

      const ground = Bodies.rectangle(400, 370, 800, 40, { isStatic: true, render: { fillStyle: '#2d3436' } });
      const leftWall = Bodies.rectangle(-20, 200, 40, 400, { isStatic: true });
      const rightWall = Bodies.rectangle(820, 200, 40, 400, { isStatic: true });
      Composite.add(engine.world, [ground, leftWall, rightWall]);

      const mouse = Mouse.create(render.canvas);
      mouseConstraint = MouseConstraint.create(engine, { mouse: mouse, constraint: { stiffness: 0.1, render: { visible: false } }, collisionFilter: { mask: BIRD_CATEGORY } });
      Composite.add(engine.world, mouseConstraint);

      window.addEventListener('resize', () => {
        Mouse.setScale(mouseConstraint.mouse, {
            x: WIDTH / canvas.getBoundingClientRect().width,
            y: HEIGHT / canvas.getBoundingClientRect().height
        });
      });
      setTimeout(() => {
          Mouse.setScale(mouseConstraint.mouse, {
              x: WIDTH / canvas.getBoundingClientRect().width,
              y: HEIGHT / canvas.getBoundingClientRect().height
          });
      }, 500);

      Events.on(mouseConstraint, 'enddrag', (e) => {
        if (e.body === currentBird && !isLaunched && levelReady) {
          const dist = Vector.magnitude(Vector.sub(currentBird.position, slingAnchor));
          if (dist > 15) {
            isLaunched = true; canSkill = true;
            if (spawnTimeout) clearTimeout(spawnTimeout);
            spawnTimeout = setTimeout(spawnNextBird, 4000);
          }
        }
      });

      Events.on(engine, 'collisionStart', (e) => {
        if (!levelReady) return; 
        e.pairs.forEach(pair => {
          if (!isLaunched && currentBird && (pair.bodyA === currentBird || pair.bodyB === currentBird)) return;
          pigs.forEach(pig => {
            if (pair.bodyA === pig || pair.bodyB === pig) {
              const speedA = Vector.magnitude(pair.bodyA.velocity); const speedB = Vector.magnitude(pair.bodyB.velocity);
              if (Math.max(speedA, speedB) > 1.8) pig.hp -= Math.max(speedA, speedB) * 15; 
            }
          });
        });
      });

      canvas.addEventListener('pointerdown', () => {
        if (isLaunched && canSkill && currentBird && levelReady) {
          canSkill = false;
          const pos = currentBird.position;
          
          if (currentBird.bType === 'black') {
             const bodies = Composite.allBodies(engine.world);
             bodies.forEach(b => {
               if (!b.isStatic) {
                 const d = Vector.magnitude(Vector.sub(b.position, pos));
                 if (d < 180 && d > 0) Body.applyForce(b, b.position, Vector.mult(Vector.normalise(Vector.sub(b.position, pos)), 0.3 * (1 - d/180)));
               }
             });
             currentBird.render.fillStyle = '#f1c40f'; 
          } else if (currentBird.bType === 'yellow') {
             let norm = Vector.normalise(currentBird.velocity);
             Body.applyForce(currentBird, pos, Vector.mult(norm, 0.25));
          } else if (currentBird.bType === 'red') {
             let norm = Vector.normalise(currentBird.velocity);
             Body.applyForce(currentBird, pos, Vector.mult(norm, 0.08));
          }
        }
      });

      Events.on(engine, 'beforeUpdate', () => {
        if (currentBird && !isLaunched) {
          const dist = Vector.magnitude(Vector.sub(currentBird.position, slingAnchor));
          if (dist > MAX_PULL_DISTANCE) {
            const dir = Vector.normalise(Vector.sub(currentBird.position, slingAnchor));
            Body.setPosition(currentBird, Vector.add(slingAnchor, Vector.mult(dir, MAX_PULL_DISTANCE)));
            Body.setVelocity(currentBird, { x: 0, y: 0 });
          }
        }
        for (let i = pigs.length - 1; i >= 0; i--) {
          if (pigs[i].hp <= 0 || pigs[i].position.y > HEIGHT) {
            Composite.remove(engine.world, pigs[i]); pigs.splice(i, 1);
          }
        }
        if(document.getElementById('game-container').style.display !== 'none') {
          updateUI(); checkLevelRules();
        }
      });
    }

    function createBlock(x, y, w, h, type = 'wood', options = {}) {
      let color = type==='steel'?'#34495e':(type==='stone'?'#95a5a6':'#d35400');
      let density = type==='steel'?0.02:(type==='stone'?0.005:0.001);
      const config = Object.assign({ density: density, friction: 0.5, render: { fillStyle: color, strokeStyle: '#111', lineWidth: 1 } }, options);
      const block = Bodies.rectangle(x, y, w, h, config);
      blocks.push(block); Composite.add(engine.world, block);
    }
    
    function createPig(x, y, r, hp = 30) {
      const pig = Bodies.circle(x, y, r, { density: 0.001, friction: 0.3, restitution: 0.2, render: { fillStyle: '#2ecc71', strokeStyle: '#27ae60', lineWidth: 2 } });
      pig.hp = hp; pigs.push(pig); Composite.add(engine.world, pig);
    }

    function generateLevel(levelIdx) {
      let designIdx = levelIdx % LEVEL_DESIGNS.length;
      let loopCount = Math.floor(levelIdx / LEVEL_DESIGNS.length);
      let design = LEVEL_DESIGNS[designIdx];

      if (design.customBuild) {
         design.customBuild(loopCount);
      } else {
         design.towers.forEach(t => {
           let currentY = 350;
           for (let h = 0; h < t.h; h++) {
             createBlock(t.x, currentY - 40, 15, 80, t.mat); createBlock(t.x + 50, currentY - 40, 15, 80, t.mat); createBlock(t.x + 25, currentY - 85, 90, 15, t.mat);
             if (h === t.h - 1 || (h % 2 === 0)) createPig(t.x + 25, currentY - 40, 14, 30 + (levelIdx * 10)); 
             currentY -= 90; 
           }
         });
      }
      
      let q = [...design.baseBirds];
      for(let i=0; i<loopCount; i++) q.push('red'); 
      return q;
    }

    function spawnBird() {
      if (birdQueue.length === 0) return;
      let typeKey = birdQueue.shift();
      let bData = BIRD_TYPES[typeKey];
      
      isLaunched = false; canSkill = false;
      currentBird = Bodies.circle(slingAnchor.x, slingAnchor.y, bData.r, {
        density: bData.density, friction: 0.2, restitution: bData.rest, collisionFilter: { category: BIRD_CATEGORY },
        render: { fillStyle: bData.color, strokeStyle: '#ecf0f1', lineWidth: 2 }
      });
      currentBird.bType = typeKey;
      allBirds.push(currentBird); 

      const sling = Constraint.create({ pointA: slingAnchor, bodyB: currentBird, stiffness: 0.06, length: 0, render: { visible: true, strokeStyle: '#aaa', lineWidth: 3 } });
      Events.on(engine, 'afterUpdate', function releaseHandler() {
        if (isLaunched && sling.bodyB) {
          if (Vector.magnitude(Vector.sub(currentBird.position, slingAnchor)) < 15 || currentBird.position.x > slingAnchor.x + 10) {
            sling.bodyB = null; Composite.remove(engine.world, sling); Events.off(engine, 'afterUpdate', releaseHandler);
          }
        }
      });
      Composite.add(engine.world, [currentBird, sling]);
    }
    
    function spawnNextBird() {
      if (pigs.length > 0 && birdQueue.length > 0 && !isLevelTransitioning) {
        if (gameMode === '2p') {
          currentPlayer = currentPlayer === 1 ? 2 : 1; 
        }
        spawnBird();
      }
    }

    function clearGameWorld() {
      if (spawnTimeout) clearTimeout(spawnTimeout);
      pigs.forEach(p => Composite.remove(engine.world, p)); 
      blocks.forEach(b => Composite.remove(engine.world, b)); 
      allBirds.forEach(b => Composite.remove(engine.world, b));
      customConstraints.forEach(c => Composite.remove(engine.world, c));
      pigs = []; blocks = []; allBirds = []; customConstraints = [];
    }

    function loadLevel(idx) {
      isLevelTransitioning = true; levelReady = false; currentLevel = idx;
      currentPlayer = 1; 
      clearGameWorld();
      birdQueue = generateLevel(currentLevel);
      spawnBird();
      setTimeout(() => { isLevelTransitioning = false; levelReady = true; }, 1000);
    }

    function checkLevelRules() {
      if (isLevelTransitioning || !levelReady) return;

      if (pigs.length === 0) {
        isLevelTransitioning = true;
        if (currentLevel === unlockedLevel) unlockedLevel++;
        setTimeout(() => {
          let birdBonus = birdQueue.length * 5; let totalReward = 20 + birdBonus; coins += totalReward;
          let msgTitle = gameMode === '1p' ? "🎉 關卡完成！" : "🎉 合作無間！過關！";
          showOverlay(msgTitle, `基礎獎勵: +20 金幣\n節省鳥類: +${birdBonus} 金幣\n總計獲得: ${totalReward} 金幣！`, 
            [ { text: "挑戰下一關", colorClass: "btn-green", action: () => loadLevel(currentLevel + 1) }, 
              { text: "回地圖", colorClass: "btn-map", action: () => backToMap() } ]
          );
        }, 1000); 
      } 
      else if (birdQueue.length === 0 && isLaunched && pigs.length > 0 && currentBird) {
        const speed = Vector.magnitude(currentBird.velocity);
        if (speed < 0.1 || currentBird.position.x > WIDTH + 100 || currentBird.position.y > HEIGHT + 50) {
          isLevelTransitioning = true;
          setTimeout(() => {
            if (birdQueue.length > 0 || !isLaunched) { isLevelTransitioning = false; return; }
            if (pigs.length > 0) {
                showOverlay("💀 彈藥耗盡！", `你們還有 ${coins} 枚金幣，要進商店買鳥逆轉嗎？`, 
                  [ { text: "🛒 打開鳥店", colorClass: "btn-yellow", action: () => openShop() }, 
                    { text: "重新挑戰", colorClass: "btn-restart", action: () => loadLevel(currentLevel) }, 
                    { text: "回地圖", colorClass: "btn-map", action: () => backToMap() } ]
                );
            } else { isLevelTransitioning = false; }
          }, 1500); 
        }
      }
    }
    
    function restartLevel() { if (!isLevelTransitioning && levelReady) loadLevel(currentLevel); }
    
    function updateUI() {
      document.getElementById('lvl-txt').textContent = `${currentLevel + 1}`;
      document.getElementById('birds-txt').textContent = birdQueue.length + (currentBird && !isLaunched ? 1 : 0);
      document.getElementById('pigs-txt').textContent = pigs.length;
      document.getElementById('coins-txt').textContent = coins;

      const turnInd = document.getElementById('turn-indicator');
      if (gameMode === '2p') {
          turnInd.style.display = "block";
          if (currentPlayer === 1) {
              turnInd.textContent = "🎮 1P 回合 (紅)";
              turnInd.style.background = "rgba(231, 76, 60, 0.9)";
          } else {
              turnInd.textContent = "🎮 2P 回合 (藍)";
              turnInd.style.background = "rgba(52, 152, 219, 0.9)";
          }
      } else {
          turnInd.style.display = "none";
      }
    }
  </script>
</body>
