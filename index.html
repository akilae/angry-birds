<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>憤怒鳥：五大關卡極限戰役 (Matter.js Edition)</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
    }
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #1a1a2e;
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #ui-layer {
      position: absolute;
      top: 10px;
      width: 95%;
      max-width: 800px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      padding: 10px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .hud-title { font-size: 18px; font-weight: bold; color: #f39c12; }
    .hud-status { font-size: 14px; }
    #btn-restart {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 2 / 1;
      background: linear-gradient(to bottom, #70a1ff, #dfe4ea);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    canvas { width: 100%; height: 100%; display: block; }
  </style>
  <!-- 引入 Matter.js 2D 物理引擎 CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>

  <div id="ui-layer">
    <div class="hud-title">關卡：<span id="lvl-txt">1 / 5</span></div>
    <div class="hud-status">剩餘紅鳥：<span id="birds-txt">3</span> | 敵豬：<span id="pigs-txt">0</span></div>
    <button id="btn-restart" onclick="restartLevel()">重置本關</button>
  </div>

  <div id="game-container">
    <canvas id="canvas"></canvas>
  </div>

  <script>
    const { Engine, Render, Runner, Bodies, Composite, Constraint, Mouse, MouseConstraint, Events, Body, Vector } = Matter;

    const canvas = document.getElementById('canvas');
    const container = document.getElementById('game-container');
    const WIDTH = 800;
    const HEIGHT = 400;

    let engine, runner, render, mouseConstraint;
    let slingAnchor = { x: 130, y: 280 };
    let currentLevel = 0;
    let birdsLeft = 3;
    let currentBird = null;
    let isLaunched = false;
    let pigs = [];
    let blocks = [];
    let canSkill = false;

    // 關卡配置陣列
    const LEVEL_CONFIGS = [
      // 關卡 1：新手木塔
      {
        birds: 3,
        build: () => {
          createBlock(550, 310, 15, 80, '#d35400');
          createBlock(630, 310, 15, 80, '#d35400');
          createBlock(590, 265, 100, 15, '#e67e22');
          createPig(590, 240, 16);
        }
      },
      // 關卡 2：雙重木城堡
      {
        birds: 3,
        build: () => {
          createBlock(500, 310, 15, 80, '#d35400');
          createBlock(560, 310, 15, 80, '#d35400');
          createBlock(530, 265, 80, 15, '#e67e22');
          createPig(530, 240, 15);

          createBlock(640, 310, 15, 80, '#d35400');
          createBlock(700, 310, 15, 80, '#d35400');
          createBlock(670, 265, 80, 15, '#e67e22');
          createPig(670, 240, 15);
        }
      },
      // 關卡 3：三層高塔巨陣
      {
        birds: 4,
        build: () => {
          // 一層
          createBlock(560, 310, 15, 80, '#7f8c8d');
          createBlock(640, 310, 15, 80, '#7f8c8d');
          createBlock(600, 265, 100, 15, '#bdc3c7');
          createPig(600, 240, 15);
          // 二層
          createBlock(575, 220, 15, 70, '#d35400');
          createBlock(625, 220, 15, 70, '#d35400');
          createBlock(600, 180, 75, 15, '#e67e22');
          createPig(600, 155, 14);
        }
      },
      // 關卡 4：石質堡壘護衛
      {
        birds: 4,
        build: () => {
          // 石壁
          createBlock(480, 290, 25, 120, '#2c3e50');
          createBlock(580, 310, 15, 80, '#d35400');
          createBlock(660, 310, 15, 80, '#d35400');
          createBlock(620, 265, 100, 15, '#e67e22');
          createPig(620, 240, 18);
          createPig(530, 330, 15);
        }
      },
      // 關卡 5：綠豬王終極要塞
      {
        birds: 4,
        build: () => {
          createBlock(500, 290, 20, 120, '#2c3e50');
          createBlock(720, 290, 20, 120, '#2c3e50');
          createBlock(610, 225, 240, 15, '#7f8c8d');

          createBlock(550, 180, 15, 70, '#d35400');
          createBlock(670, 180, 15, 70, '#d35400');
          createBlock(610, 140, 140, 15, '#e67e22');

          createPig(610, 105, 22); // 綠豬王
          createPig(550, 330, 15);
          createPig(670, 330, 15);
        }
      }
    ];

    function initEngine() {
      engine = Engine.create({ gravity: { x: 0, y: 1 } });
      canvas.width = WIDTH;
      canvas.height = HEIGHT;

      render = Render.create({
        canvas: canvas,
        engine: engine,
        options: {
          width: WIDTH,
          height: HEIGHT,
          wireframes: false,
          background: 'transparent'
        }
      });

      Runner.run(Runner.create(), engine);
      Render.run(render);

      // 地板與邊界
      const ground = Bodies.rectangle(400, 370, 800, 40, { isStatic: true, render: { fillStyle: '#27ae60' } });
      const leftWall = Bodies.rectangle(-10, 200, 20, 400, { isStatic: true });
      const rightWall = Bodies.rectangle(810, 200, 20, 400, { isStatic: true });
      Composite.add(engine.world, [ground, leftWall, rightWall]);

      // 觸控 / 滑鼠控制
      const mouse = Mouse.create(render.canvas);
      mouseConstraint = MouseConstraint.create(engine, {
        mouse: mouse,
        constraint: { stiffness: 0.1, render: { visible: false } }
      });
      Composite.add(engine.world, mouseConstraint);

      // 畫面發射拉曳邏輯
      Events.on(mouseConstraint, 'enddrag', (e) => {
        if (e.body === currentBird && !isLaunched) {
          const dist = Vector.magnitude(Vector.sub(currentBird.position, slingAnchor));
          if (dist > 20) {
            isLaunched = true;
            canSkill = true;
            setTimeout(spawnNextBird, 4000);
          }
        }
      });

      // 碰撞檢測：消除敵豬
      Events.on(engine, 'collisionStart', (e) => {
        e.pairs.forEach(pair => {
          pigs.forEach(pig => {
            if ((pair.bodyA === pig || pair.bodyB === pig) && pair.collision.supports.length > 0) {
              const speedA = Vector.magnitude(pair.bodyA.velocity);
              const speedB = Vector.magnitude(pair.bodyB.velocity);
              if (speedA > 2.5 || speedB > 2.5) {
                pig.hp -= Math.max(speedA, speedB) * 15;
              }
            }
          });
        });
      });

      // 點擊觸發「爆破炸彈技能」
      canvas.addEventListener('pointerdown', () => {
        if (isLaunched && canSkill && currentBird) {
          canSkill = false;
          // 產生半徑 150px 的衝擊波爆破
          const pos = currentBird.position;
          const bodies = Composite.allBodies(engine.world);
          bodies.forEach(b => {
            if (!b.isStatic) {
              const d = Vector.magnitude(Vector.sub(b.position, pos));
              if (d < 150 && d > 0) {
                const force = Vector.mult(Vector.normalise(Vector.sub(b.position, pos)), 0.15 * (1 - d / 150));
                Body.applyForce(b, b.position, force);
              }
            }
          });
          currentBird.render.fillStyle = '#f1c40f';
        }
      });

      // 主循環：清理生命值歸零的豬隻與更新 UI
      Events.on(engine, 'beforeUpdate', () => {
        for (let i = pigs.length - 1; i >= 0; i--) {
          if (pigs[i].hp <= 0) {
            Composite.remove(engine.world, pigs[i]);
            pigs.splice(i, 1);
          }
        }
        updateUI();
        checkLevelRules();
      });

      loadLevel(0);
    }

    function createBlock(x, y, w, h, color) {
      const block = Bodies.rectangle(x, y, w, h, {
        density: 0.001,
        friction: 0.5,
        render: { fillStyle: color, strokeStyle: '#2c3e50', lineWidth: 1 }
      });
      blocks.push(block);
      Composite.add(engine.world, block);
    }

    function createPig(x, y, r) {
      const pig = Bodies.circle(x, y, r, {
        density: 0.0008,
        friction: 0.3,
        restitution: 0.2,
        render: { fillStyle: '#2ecc71', strokeStyle: '#27ae60', lineWidth: 2 }
      });
      pig.hp = 30;
      pigs.push(pig);
      Composite.add(engine.world, pig);
    }

    function spawnBird() {
      if (birdsLeft <= 0) return;
      birdsLeft--;
      isLaunched = false;
      canSkill = false;

      currentBird = Bodies.circle(slingAnchor.x, slingAnchor.y, 14, {
        density: 0.004,
        friction: 0.2,
        restitution: 0.4,
        render: { fillStyle: '#e74c3c' }
      });

      const sling = Constraint.create({
        pointA: slingAnchor,
        bodyB: currentBird,
        stiffness: 0.05,
        length: 0,
        render: { visible: true, strokeStyle: '#7f8c8d', lineWidth: 3 }
      });

      Events.on(engine, 'afterUpdate', function releaseHandler() {
        if (isLaunched && sling.bodyB) {
          const dist = Vector.magnitude(Vector.sub(currentBird.position, slingAnchor));
          if (dist < 10 || currentBird.position.x > slingAnchor.x + 10) {
            sling.bodyB = null;
            Composite.remove(engine.world, sling);
            Events.off(engine, 'afterUpdate', releaseHandler);
          }
        }
      });

      Composite.add(engine.world, [currentBird, sling]);
    }

    function spawnNextBird() {
      if (pigs.length > 0 && birdsLeft > 0) {
        spawnBird();
      }
    }

    function loadLevel(idx) {
      currentLevel = idx;
      // 清空舊實體
      pigs.forEach(p => Composite.remove(engine.world, p));
      blocks.forEach(b => Composite.remove(engine.world, b));
      if (currentBird) Composite.remove(engine.world, currentBird);
      pigs = [];
      blocks = [];

      const cfg = LEVEL_CONFIGS[currentLevel];
      birdsLeft = cfg.birds;
      cfg.build();
      spawnBird();
    }

    function checkLevelRules() {
      // 擊敗所有敵豬 -> 進下一關
      if (pigs.length === 0 && currentLevel < LEVEL_CONFIGS.length) {
        setTimeout(() => {
          if (currentLevel + 1 < LEVEL_CONFIGS.length) {
            alert(`🎉 恭喜通關第 ${currentLevel + 1} 關！進入下一個考驗！`);
            loadLevel(currentLevel + 1);
          } else {
            alert('🏆 霸氣！你已順利通關全數 5 大關卡，徹底摧毀綠豬王國！');
            loadLevel(0);
          }
        }, 500);
      }
    }

    function restartLevel() {
      loadLevel(currentLevel);
    }

    function updateUI() {
      document.getElementById('lvl-txt').textContent = `${currentLevel + 1} / ${LEVEL_CONFIGS.length}`;
      document.getElementById('birds-txt').textContent = birdsLeft + (currentBird && !isLaunched ? 1 : 0);
      document.getElementById('pigs-txt').textContent = pigs.length;
    }

    window.onload = initEngine;
  </script>
</body>
</html>
