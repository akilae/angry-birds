<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>可愛小鳥大冒險 - 萌力爆發版</title>
    <!-- 引入 Matter.js 物理引擎 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #e0f7fa; /* 淺藍色天空背景 */
            font-family: 'Microsoft JhengHei', sans-serif;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #333;
            background: rgba(255, 255, 255, 0.7);
            padding: 5px 10px;
            border-radius: 8px;
            pointer-events: none; /* 讓 UI 不會阻擋點擊事件 */
        }
        #rstBtn {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 10px 20px;
            background-color: #ffeb3b;
            border: 2px solid #fbc02d;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div id="ui">得分: <span id="score">0</span></div>
<button id="rstBtn">重置關卡</button>

<script>
// --- 遊戲設定 ---
const gameConfig = {
    birdRadius: 25, // 小鳥半徑，變大一點比較可愛
    pigRadius: 20,
    boxSize: 40,
    slingPos: { x: 150, y: 0 }, // y 會在初始化時根據螢幕高度調整
    cols: {
        sky: '#87CEEB',
        grass: '#76b947',
        wood: '#cd853f',
        pig: '#a5d6a7', // 淺綠色小豬
        birdBody: '#4fc3f7', // 亮藍色身體
        birdEye: '#fff',
        birdPupil: '#000',
        birdBeak: '#ffb74d', // 橘色嘴巴
        birdTail: ['#ff1744', '#ffeb3b', '#00e676'] // 彩色尾巴
    }
};

let score = 0;

// --- Matter.js 模組初始化 ---
const { Engine, Render, Runner, World, Bodies, Constraint, Mouse, MouseConstraint, Events, Composite, Body } = Matter;

const engine = Engine.create();
const world = engine.world;

// 取得螢幕寬高
const sW = window.innerWidth;
const sH = window.innerHeight;
gameConfig.slingPos.y = sH * 0.65; // 發射台高度

// 建立渲染器
const render = Render.create({
    element: body,
    engine: engine,
    options: {
        width: sW,
        height: sH,
        wireframes: false, // 關閉線框模式，使用自定義繪圖
        background: 'transparent' // 背景由 CSS 處理
    }
});

Render.run(render);
const runner = Runner.create();
Runner.run(runner, engine);

// --- 建立遊戲物體 ---

// 1. 地板
const ground = Bodies.rectangle(sW / 2, sH + 30, sW, 60, { 
    isStatic: true, 
    render: { fillStyle: gameConfig.cols.grass } 
});

// 2. 可愛小鳥 (主角)
let bird;
function createBird() {
    bird = Bodies.circle(gameConfig.slingPos.x, gameConfig.slingPos.y, gameConfig.birdRadius, {
        density: 0.004,
        frictionAir: 0.005,
        restitution: 0.5, // 有一點彈性
        render: { visible: false }, // 我們用自定義方法畫，所以隱藏 Matter 自帶的渲染
        label: 'bird'
    });
    World.add(world, bird);
}

// 3. 彈弓約束
let slingshot;
function createSlingshot() {
    slingshot = Constraint.create({
        pointA: { x: gameConfig.slingPos.x, y: gameConfig.slingPos.y },
        bodyB: bird,
        stiffness: 0.05,
        damping: 0.01,
        render: {
            strokeStyle: '#5d4037', // 咖啡色皮筋
            lineWidth: 5
        }
    });
    World.add(world, slingshot);
}

// 4. 堆疊結構 (木箱與小豬)
function createTargets() {
    const startX = sW * 0.7;
    const startY = sH - 30 - gameConfig.boxSize/2;

    // 建立一個簡單的塔
    const stack = Composite.create();
    
    // 第一層
    Composite.add(stack, Bodies.rectangle(startX, startY, gameConfig.boxSize, gameConfig.boxSize, { render: { fillStyle: gameConfig.cols.wood } }));
    Composite.add(stack, Bodies.rectangle(startX + gameConfig.boxSize * 1.5, startY, gameConfig.boxSize, gameConfig.boxSize, { render: { fillStyle: gameConfig.cols.wood } }));
    
    // 小豬在第一層中間
    Composite.add(stack, Bodies.circle(startX + gameConfig.boxSize * 0.75, startY, gameConfig.pigRadius, { 
        label: 'pig',
        render: { visible: false } // 自定義繪圖
    }));

    // 第二層 (橫樑)
    Composite.add(stack, Bodies.rectangle(startX + gameConfig.boxSize * 0.75, startY - gameConfig.boxSize, gameConfig.boxSize * 2.5, gameConfig.boxSize, { render: { fillStyle: gameConfig.cols.wood } }));

    // 第三層
    Composite.add(stack, Bodies.circle(startX + gameConfig.boxSize * 0.75, startY - gameConfig.boxSize * 2, gameConfig.pigRadius, { 
        label: 'pig',
        render: { visible: false } 
    }));

    World.add(world, stack);
}

// 初始化關卡
function initGame() {
    World.clear(world);
    Engine.clear(engine);
    score = 0;
    document.getElementById('score').innerText = score;
    
    World.add(world, ground);
    createBird();
    createSlingshot();
    createTargets();
}

initGame();

// --- 滑鼠/觸控控制 ---
const mouse = Mouse.create(render.canvas);
const mouseConstraint = MouseConstraint.create(engine, {
    mouse: mouse,
    constraint: {
        stiffness: 0.2,
        render: { visible: false }
    }
});

World.add(world, mouseConstraint);
render.mouse = mouse; // 讓 Matter.js 知道處理這個畫布的滑鼠

// --- 遊戲邏輯 ---

let isFiring = false;

// 檢測釋放滑鼠/手指
Events.on(mouseConstraint, 'enddrag', function(event) {
    if (event.body === bird) {
        isFiring = true;
    }
});

// 每一幀更新後的邏輯
Events.on(engine, 'afterUpdate', function() {
    // 1. 彈弓釋放邏輯
    if (isFiring && slingshot.bodyB && bird.position.x > gameConfig.slingPos.x + 10) {
        // 當小鳥越過彈弓支點時，切斷約束
        slingshot.bodyB = null;
        slingshot.render.visible = false;
        isFiring = false;
        
        // 幾秒後重置小鳥 (如果沒撞到東西的話)
        setTimeout(() => {
            if (!slingshot.bodyB && bird.speed < 1) {
                resetBird();
            }
        }, 3000);
    }
    
    // 2. 檢查小豬是否被打敗 (掉出螢幕外或速度過快)
    const bodies = Composite.allBodies(world);
    bodies.forEach(body => {
        if (body.label === 'pig' && (body.position.y > sH || body.speed > 10)) {
            World.remove(world, body);
            score += 500;
            document.getElementById('score').innerText = score;
        }
    });
});

// 重置小鳥到彈弓上
function resetBird() {
    World.remove(world, bird);
    createBird();
    slingshot.bodyB = bird;
    slingshot.render.visible = true;
}

// 重置按鈕
document.getElementById('rstBtn').addEventListener('click', initGame);


// --- 自定義繪圖：把小鳥變可愛的核心 ---
// 我們監聽 Matter.js 的 afterRender 事件，在原本的物理畫布上覆蓋我們畫的可愛圖案

Events.on(render, 'afterRender', function() {
    const ctx = render.context;
    const bodies = Composite.allBodies(world);

    // 遍歷所有物體進行自定義繪製
    bodies.forEach(body => {
        if (body.label === 'bird') {
            drawCuteBird(ctx, body);
        } else if (body.label === 'pig') {
            drawCutePig(ctx, body);
        }
    });
});

// 繪製萌萌小鳥
function drawCuteBird(ctx, body) {
    const { x, y } = body.position;
    const angle = body.angle;
    const r = gameConfig.birdRadius;

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);

    // 1. 繪製彩色尾巴
    gameConfig.cols.birdTail.forEach((col, i) => {
        ctx.fillStyle = col;
        ctx.beginPath();
        // 尾巴向左延伸
        ctx.ellipse(-r + 5 - i*8, 5 + i*2, 15, 6, -Math.PI/6 * i, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 1;
        ctx.stroke();
    });

    // 2. 身體 (亮藍色圓形)
    ctx.fillStyle = gameConfig.cols.birdBody;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 2;
    ctx.stroke();

    // 3. 萌萌大眼睛
    const eyeX = r * 0.4;
    const eyeY = -r * 0.2;
    const eyeR = r * 0.35;

    // 白眼球
    ctx.fillStyle = gameConfig.cols.birdEye;
    ctx.beginPath();
    ctx.arc(eyeX, eyeY, eyeR, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.stroke();

    // 黑瞳孔
    ctx.fillStyle = gameConfig.cols.birdPupil;
    ctx.beginPath();
    ctx.arc(eyeX + eyeR*0.3, eyeY, eyeR * 0.6, 0, Math.PI * 2);
    ctx.fill();
    
    // 眼睛高光 (讓眼睛閃亮)
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(eyeX + eyeR*0.5, eyeY - eyeR*0.3, eyeR * 0.25, 0, Math.PI * 2);
    ctx.fill();

    // 4. 橘色嘴巴
    ctx.fillStyle = gameConfig.cols.birdBeak;
    ctx.beginPath();
    ctx.moveTo(r * 0.8, eyeY + eyeR);
    ctx.lineTo(r * 1.3, r * 0.2); // 嘴尖
    ctx.lineTo(r * 0.7, r * 0.4);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.restore();
}

// 繪製綠色小豬
function drawCutePig(ctx, body) {
    const { x, y } = body.position;
    const r = gameConfig.pigRadius;

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(body.angle);

    // 身體
    ctx.fillStyle = gameConfig.cols.pig;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 2;
    ctx.stroke();

    // 豬鼻子
    ctx.fillStyle = '#81c784';
    ctx.beginPath();
    ctx.ellipse(0, r*0.1, r*0.5, r*0.4, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#333';
    ctx.stroke();
    
    // 鼻孔
    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.arc(-r*0.2, r*0.1, r*0.08, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(r*0.2, r*0.1, r*0.08, 0, Math.PI*2); ctx.fill();

    // 眼睛
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-r*0.4, -r*0.3, r*0.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(r*0.4, -r*0.3, r*0.2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(-r*0.4, -r*0.3, r*0.1, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(r*0.4, -r*0.3, r*0.1, 0, Math.PI*2); ctx.fill();

    ctx.restore();
}


// 處理視窗大小改變
window.addEventListener('resize', function() {
    render.canvas.width = window.innerWidth;
    render.canvas.height = window.innerHeight;
    // 這裡簡單重置關卡，實戰中需要更複雜的適應邏輯
    initGame();
});

</script>
</body>
</html>
