<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>憤怒鳥：雙機連線挑戰版</title>
  <style>
    * {
      box-sizing: border-box; -webkit-touch-callout: none;
      -webkit-user-select: none; user-select: none; touch-action: none;
    }
    body {
      margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden;
      background: #000; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    
    #ui-layer {
      position: fixed; top: env(safe-area-inset-top, 10px); width: 98%; max-width: 800px;
      display: flex; justify-content: space-between; align-items: center; z-index: 20;
      background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px);
      padding: 8px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2);
      color: white; box-shadow: 0 4px 20px rgba(0,0,0,0.6); gap: 8px;
    }
    .hud-group { display: flex; flex-direction: column; gap: 4px; }
    .hud-text { font-size: 14px; font-weight: bold; white-space: nowrap; color: #fff;}
    .highlight { color: #f1c40f; font-size: 16px;}
    .rival-score { color: #e74c3c; font-size: 12px; }
    
    .btn-group { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end;}
    button {
      padding: 8px 12px; border-radius: 8px; font-weight: bold; font-size: 13px;
      cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.5); white-space: nowrap; transition: transform 0.1s; border: none;
    }
    button:active { transform: scale(0.95); }
    .btn-restart { background: #3498db; color: white; border: 2px solid #2980b9; }
    
    #game-container {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(to bottom, #1e3c72, #2a5298); z-index: 1;
      display: flex; align-items: center; justify-content: center;
    }
    canvas {
      width: 100%; max-width: calc(100vh * 2); height: auto; aspect-ratio: 2 / 1;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    .overlay-base {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85); z-index: 100; flex-direction: column; align-items: center; justify-content: center;
    }
    .overlay-box {
      background: linear-gradient(135deg, #2c3e50, #34495e); padding: 30px; border-radius: 15px;
      border: 2px solid #f1c40f; text-align: center; box-shadow: 0 0 40px rgba(241, 196, 15, 0.4); color: white; min-width: 300px; max-width: 90%;
    }
    .overlay-title { font-size: 24px; color: #f1c40f; margin-bottom: 15px; font-weight: bold; }
    .overlay-msg { font-size: 16px; margin-bottom: 25px; line-height: 1.6; white-space: pre-line; color: #ecf0f1; }
    .overlay-btn { margin: 5px; padding: 12px 20px; border:none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; color: white; width: 100%; }
    
    .btn-green { background: #2ecc71; box-shadow: 0 4px #27ae60; } .btn-green:active { transform: translateY(4px); box-shadow: 0 0 #27ae60; }
    .btn-yellow { background: #f1c40f; box-shadow: 0 4px #d4ac0d; color: #333; } .btn-yellow:active { transform: translateY(4px); box-shadow: 0 0 #d4ac0d; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>

  <div id="ui-layer">
    <div class="hud-group">
      <div class="hud-text">你的分數: <span id="score-txt" class="highlight">0</span></div>
      <div class="hud-text rival-score" id="rival-display" style="display: none;">對手分數: <span id="rival-score-txt">0</span></div>
    </div>
    <div class="hud-group" style="align-items: center;">
      <div class="hud-text">🐦 <span id="birds-txt">3</span> | 🐷 <span id="pigs-txt">0</span></div>
    </div>
    <div class="btn-group">
      <button class="btn-restart" onclick="restartLevel()">重置關卡</button>
    </div>
  </div>

  <div id="game-container"><canvas id="canvas"></canvas></div>

  <!-- 對戰結果提示框 -->
  <div id="overlay" class="overlay-base">
    <div class="overlay-box">
      <div class="overlay-title" id="overlay-title">戰局結束</div>
      <div class="overlay-msg" id="overlay-msg">計算中...</div>
      <div id="overlay-btns" style="display: flex; flex-direction: column; gap: 10px;"></div>
    </div>
  </div>

  <script>
    const { Engine, Render, Runner, Bodies, Composite, Constraint, Mouse, MouseConstraint, Events, Body, Vector } = Matter;

    const canvas = document.getElementById('canvas');
    const WIDTH = 800; const HEIGHT = 400;
    const MAX_PULL_DISTANCE = 120; 

    let engine, render, mouseConstraint;
    let slingAnchor = { x: 130, y: 280 };
    
    // --- 連線挑戰系統變數 ---
    let mapSeed = Date.now(); // 預設隨機關卡種子
    let currentSeed = mapSeed; // 用於重置狀態
    let rivalScore = 0; // 紀錄傳進來的對手分數
    let isChallengeMode = false;
    let myScore = 0;
    let totalPigs = 0;
    
    let birdsLeft = 4;
    let currentBird = null;
    let isLaunched = false;
    let pigs = []; let blocks = []; let allBirds = []; 
    let isLevelTransitioning = false; 
    let spawnTimeout = null; 
    const BIRD_CATEGORY = 0x0002;

    // 自製偽亂數生成器 (確保兩支手機生成的關卡 100% 相同)
    function seededRandom() {
      let x = Math.sin(currentSeed++) * 10000;
      return x - Math.floor(x);
    }

    // 解析網址參數，檢查是否為朋友傳來的挑戰連結
    function parseURLParams() {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has('seed')) {
        mapSeed = parseInt(urlParams.get('seed'), 10);
        isChallengeMode = true;
      }
      if (urlParams.has('score')) {
        rivalScore = parseInt(urlParams.get('score'), 10);
        document.getElementById('rival-display').style.display = 'block';
        document.getElementById('rival-score-txt').textContent = rivalScore;
      }
    }

    // 生成挑戰網址並複製到剪貼簿
    function shareChallengeLink() {
      // 網址去除原有的參數，重新加上新的種子與分數
      const baseUrl = window.location.origin + window.location.pathname;
      const shareUrl = `${baseUrl}?seed=${mapSeed}&score=${myScore}`;
      
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(shareUrl).then(() => {
          alert('🔗 挑戰網址已複製！快傳給朋友或貼到群組，看誰能打破你的紀錄！\n\n' + shareUrl);
        }).catch(err => {
          prompt('請手動複製以下網址傳給朋友：', shareUrl);
        });
      } else {
        prompt('請手動複製以下網址傳給朋友：', shareUrl);
      }
    }

    function initEngine() {
      parseURLParams();

      engine = Engine.create({ gravity: { x: 0, y: 1.1 } }); 
      canvas.width = WIDTH; canvas.height = HEIGHT;
      render = Render.create({ canvas: canvas, engine: engine, options: { width: WIDTH, height: HEIGHT, wireframes: false, background: 'transparent' } });
      Runner.run(Runner.create(), engine); Render.run(render);

      const ground = Bodies.rectangle(400, 370, 800, 40, { isStatic: true, render: { fillStyle: '#2d3436' } });
      const leftWall = Bodies.rectangle(-20, 200, 40, 400, { isStatic: true });
      const rightWall = Bodies.rectangle(820, 200, 40, 400, { isStatic: true });
      Composite.add(engine.world, [ground, leftWall, rightWall]);

      const mouse = Mouse.create(render.canvas);
      mouseConstraint = MouseConstraint.create(engine, { mouse: mouse, constraint: { stiffness: 0.1, render: { visible: false } }, collisionFilter: { mask: BIRD_CATEGORY } });
      Composite.add(engine.world, mouseConstraint);

      Events.on(mouseConstraint, 'enddrag', (e) => {
        if (e.body === currentBird && !isLaunched && !isLevelTransitioning) {
          const dist = Vector.magnitude(Vector.sub(currentBird.position, slingAnchor));
          if (dist > 15) {
            isLaunched = true;
            if (spawnTimeout) clearTimeout(spawnTimeout);
            spawnTimeout = setTimeout(spawnNextBird, 4000);
          }
        }
      });

      Events.on(engine, 'collisionStart', (e) => {
        if (isLevelTransitioning) return; 
        e.pairs.forEach(pair => {
          if (!isLaunched && currentBird && (pair.bodyA === currentBird || pair.bodyB === currentBird)) return;
          pigs.forEach(pig => {
            if (pair.bodyA === pig || pair.bodyB === pig) {
              const speedA = Vector.magnitude(pair.bodyA.velocity); const speedB = Vector.magnitude(pair.bodyB.velocity);
              if (Math.max(speedA, speedB) > 1.8) {
                  pig.hp -= Math.max(speedA, speedB) * 15; 
                  myScore += 50; // 砸中加分
              }
            }
          });
        });
      });

      Events.on(engine, 'beforeUpdate', () => {
        if (currentBird && !isLaunched) {
          const dist = Vector.magnitude(Vector.sub(currentBird.position, slingAnchor));
          if (dist > MAX_PULL_DISTANCE) {
            const dir = Vector.normalise(Vector.sub(currentBird.position, slingAnchor));
            Body.setPosition(currentBird, Vector.add(slingAnchor, Vector.mult(dir, MAX_PULL_DISTANCE)));
            Body.setVelocity(currentBird, { x: 0, y: 0 });
          }
        }
        for (let i = pigs.length - 1; i >= 0; i--) {
          if (pigs[i].hp <= 0 || pigs[i].position.y > HEIGHT) {
            Composite.remove(engine.world, pigs[i]); 
            pigs.splice(i, 1);
            myScore += 1000; // 擊殺綠豬大加分
          }
        }
        updateUI(); checkLevelRules();
      });

      loadProceduralLevel();
    }

    function createBlock(x, y, w, h, type) {
      let color = type==='steel'?'#34495e':(type==='stone'?'#95a5a6':'#d35400');
      let density = type==='steel'?0.02:(type==='stone'?0.005:0.001);
      const block = Bodies.rectangle(x, y, w, h, { density: density, friction: 0.5, render: { fillStyle: color, strokeStyle: '#111', lineWidth: 1 } });
      blocks.push(block); Composite.add(engine.world, block);
    }
    
    function createPig(x, y, r, hp) {
      const pig = Bodies.circle(x, y, r, { density: 0.001, friction: 0.3, restitution: 0.2, render: { fillStyle: '#2ecc71', strokeStyle: '#27ae60', lineWidth: 2 } });
      pig.hp = hp; pigs.push(pig); Composite.add(engine.world, pig);
    }

    // 根據固定種子生成關卡，保證兩台手機畫面完全一致
    function buildSeededLevel() {
      let numTowers = 2 + Math.floor(seededRandom() * 3); // 2~4 座塔
      let materials = ['wood', 'wood', 'stone', 'steel'];
      let startX = 450 + (seededRandom() * 50);

      for (let i = 0; i < numTowers; i++) {
        let towerX = startX + i * 90;
        if (towerX > 750) break;
        let currentY = 350;
        let tHeight = 1 + Math.floor(seededRandom() * 3); // 1~3 層

        for (let h = 0; h < tHeight; h++) {
          let mat = materials[Math.floor(seededRandom() * materials.length)];
          createBlock(towerX, currentY - 40, 15, 80, mat); 
          createBlock(towerX + 50, currentY - 40, 15, 80, mat); 
          createBlock(towerX + 25, currentY - 85, 90, 15, mat);
          
          if (seededRandom() > 0.3 || h === tHeight - 1) {
             createPig(towerX + 25, currentY - 40, 14, 30 + seededRandom()*20); 
          }
          currentY -= 90; 
        }
      }
      
      // 保底綠豬
      if (pigs.length === 0) createPig(600, 330, 20, 50);
      totalPigs = pigs.length;
    }

    function spawnBird() {
      if (birdsLeft <= 0) return;
      birdsLeft--;
      isLaunched = false; 
      
      currentBird = Bodies.circle(slingAnchor.x, slingAnchor.y, 14, {
        density: 0.005, friction: 0.2, restitution: 0.4, collisionFilter: { category: BIRD_CATEGORY },
        render: { fillStyle: '#e74c3c', strokeStyle: '#ecf0f1', lineWidth: 2 }
      });
      allBirds.push(currentBird); 

      const sling = Constraint.create({ pointA: slingAnchor, bodyB: currentBird, stiffness: 0.06, length: 0, render: { visible: true, strokeStyle: '#aaa', lineWidth: 3 } });
      Events.on(engine, 'afterUpdate', function releaseHandler() {
        if (isLaunched && sling.bodyB) {
          if (Vector.magnitude(Vector.sub(currentBird.position, slingAnchor)) < 15 || currentBird.position.x > slingAnchor.x + 10) {
            sling.bodyB = null; Composite.remove(engine.world, sling); Events.off(engine, 'afterUpdate', releaseHandler);
          }
        }
      });
      Composite.add(engine.world, [currentBird, sling]);
    }
    
    function spawnNextBird() {
      if (pigs.length > 0 && birdsLeft > 0 && !isLevelTransitioning) spawnBird();
    }

    function clearGameWorld() {
      if (spawnTimeout) clearTimeout(spawnTimeout);
      pigs.forEach(p => Composite.remove(engine.world, p)); 
      blocks.forEach(b => Composite.remove(engine.world, b)); 
      allBirds.forEach(b => Composite.remove(engine.world, b));
      pigs = []; blocks = []; allBirds = [];
    }

    function loadProceduralLevel() {
      isLevelTransitioning = false; 
      myScore = 0;
      birdsLeft = 4;
      currentSeed = mapSeed; // 重置亂數種子，保證每次重置關卡長一樣
      
      clearGameWorld();
      buildSeededLevel();
      spawnBird();
    }

    function showEndScreen() {
      isLevelTransitioning = true;
      
      // 計算剩餘鳥的加分
      let actualBirdsLeft = birdsLeft + (currentBird && !isLaunched ? 1 : 0);
      myScore += actualBirdsLeft * 500;
      
      let title = isChallengeMode ? "⚔️ 挑戰結束" : "🎯 戰局結束";
      let msg = `你的最終得分: ${myScore}\n(剩餘小鳥加成: ${actualBirdsLeft * 500})`;
      
      if (isChallengeMode) {
         if (myScore > rivalScore) {
             msg += `\n\n🏆 太神啦！你以 ${myScore - rivalScore} 分的優勢擊敗了對手！`;
         } else if (myScore === rivalScore) {
             msg += `\n\n🤝 居然是平手！你們的實力旗鼓相當！`;
         } else {
             msg += `\n\n💀 挑戰失敗... 你差了對手 ${rivalScore - myScore} 分，再試一次吧！`;
         }
      } else {
         msg += `\n\n產生挑戰連結，傳給朋友看看誰比較強！`;
      }

      const btnContainer = document.getElementById('overlay-btns');
      btnContainer.innerHTML = '';
      
      // 建立按鈕
      const shareBtn = document.createElement('button');
      shareBtn.className = `overlay-btn btn-yellow`;
      shareBtn.textContent = "🔗 複製挑戰連結給朋友";
      shareBtn.onclick = () => { shareChallengeLink(); };
      
      const retryBtn = document.createElement('button');
      retryBtn.className = `overlay-btn btn-green`;
      retryBtn.textContent = "🔄 再挑戰一次本地形";
      retryBtn.onclick = () => { document.getElementById('overlay').style.display = 'none'; loadProceduralLevel(); };
      
      const newMapBtn = document.createElement('button');
      newMapBtn.className = `overlay-btn btn-green`;
      newMapBtn.style.background = "#8e44ad";
      newMapBtn.textContent = "🎲 隨機生成新地形";
      newMapBtn.onclick = () => { 
          document.getElementById('overlay').style.display = 'none'; 
          mapSeed = Date.now(); // 產生新種子
          isChallengeMode = false;
          document.getElementById('rival-display').style.display = 'none';
          loadProceduralLevel(); 
      };

      btnContainer.appendChild(shareBtn);
      btnContainer.appendChild(retryBtn);
      btnContainer.appendChild(newMapBtn);
      
      document.getElementById('overlay-title').textContent = title;
      document.getElementById('overlay-msg').innerText = msg;
      document.getElementById('overlay').style.display = 'flex';
    }

    function checkLevelRules() {
      if (isLevelTransitioning) return;

      if (pigs.length === 0) {
        isLevelTransitioning = true;
        setTimeout(showEndScreen, 1500); 
      } 
      else if (birdsLeft === 0 && isLaunched && pigs.length > 0 && currentBird) {
        const speed = Vector.magnitude(currentBird.velocity);
        if (speed < 0.1 || currentBird.position.x > WIDTH + 100 || currentBird.position.y > HEIGHT + 50) {
          isLevelTransitioning = true;
          setTimeout(showEndScreen, 1500); 
        }
      }
    }
    
    function restartLevel() { if (!isLevelTransitioning) loadProceduralLevel(); }
    
    function updateUI() {
      let actualBirds = birdsLeft + (currentBird && !isLaunched ? 1 : 0);
      document.getElementById('birds-txt').textContent = actualBirds;
      document.getElementById('pigs-txt').textContent = pigs.length;
      document.getElementById('score-txt').textContent = myScore;
    }
    
    window.onload = () => { initEngine(); };
  </script>
</body>
</html>
