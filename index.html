<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>憤怒鳥 - 2D物理遊戲</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1024px;
            max-height: 768px;
            background: #87CEEB;
        }
        canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            pointer-events: none;
        }
        #author {
            position: absolute;
            bottom: 10px;
            left: 15px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        #reset-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            touch-action: manipulation;
        }
        #reset-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui">得分: <span id="score">0</span></div>
    <div id="author">作者：李御銘</div>
    <button id="reset-btn" onclick="resetGame()">重置關卡</button>
</div>

<script>
const { Engine, Render, Runner, Bodies, Composite, Constraint, Mouse, MouseConstraint, Events } = Matter;

const container = document.getElementById('game-container');
const scoreEl = document.getElementById('score');

let engine, render, runner, mouseConstraint;
let bird, slingshot, isLaunched = false;
let score = 0;

const width = 1024;
const height = 768;
const slingshotPos = { x: 180, y: 550 };

function init() {
    engine = Engine.create();
    
    render = Render.create({
        element: container,
        engine: engine,
        options: {
            width: width,
            height: height,
            wireframes: false,
            background: 'transparent'
        }
    });

    Render.run(render);
    runner = Runner.create();
    Runner.run(runner, engine);

    setupScene();
    setupMouse();

    Events.on(engine, 'afterUpdate', checkBirdOutOfBounds);
    Events.on(engine, 'collisionStart', handleCollisions);

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
}

function setupScene() {
    Composite.clear(engine.world);
    score = 0;
    scoreEl.innerText = score;
    isLaunched = false;

    // 地面 (不設左右與上方邊界牆，讓鳥可自由飛出邊界)
    const ground = Bodies.rectangle(width / 2, height - 20, width * 2, 60, { 
        isStatic: true, 
        render: { fillStyle: '#2ed573' },
        label: 'ground'
    });
    Composite.add(engine.world, ground);

    // 彈弓底座
    const base = Bodies.rectangle(slingshotPos.x, slingshotPos.y + 60, 20, 120, {
        isStatic: true,
        render: { fillStyle: '#8B4513' },
        collisionFilter: { group: -1 }
    });
    Composite.add(engine.world, base);

    // 建立目標與小鳥
    createTargets();
    spawnBird();
}

function spawnBird() {
    bird = Bodies.circle(slingshotPos.x, slingshotPos.y, 20, {
        density: 0.004,
        frictionAir: 0.005,
        restitution: 0.4,
        render: { fillStyle: '#ff4757' },
        label: 'bird'
    });

    slingshot = Constraint.create({
        pointA: slingshotPos,
        bodyB: bird,
        stiffness: 0.1,
        damping: 0.01,
        length: 0,
        render: { strokeStyle: '#57606f', lineWidth: 5 }
    });

    Composite.add(engine.world, [bird, slingshot]);
    isLaunched = false;
}

function createTargets() {
    const startX = 650;
    const startY = height - 80;

    const blocks = [
        Bodies.rectangle(startX, startY, 20, 100, { render: { fillStyle: '#d2dae2' }, label: 'block' }),
        Bodies.rectangle(startX + 120, startY, 20, 100, { render: { fillStyle: '#d2dae2' }, label: 'block' }),
        Bodies.rectangle(startX + 60, startY - 60, 140, 20, { render: { fillStyle: '#d2dae2' }, label: 'block' }),
        Bodies.rectangle(startX + 20, startY - 120, 20, 100, { render: { fillStyle: '#d2dae2' }, label: 'block' }),
        Bodies.rectangle(startX + 100, startY - 120, 20, 100, { render: { fillStyle: '#d2dae2' }, label: 'block' }),
        Bodies.rectangle(startX + 60, startY - 180, 120, 20, { render: { fillStyle: '#d2dae2' }, label: 'block' })
    ];

    const pigs = [
        Bodies.circle(startX + 60, startY, 22, { render: { fillStyle: '#2ed573' }, label: 'pig' }),
        Bodies.circle(startX + 60, startY - 120, 22, { render: { fillStyle: '#2ed573' }, label: 'pig' })
    ];

    Composite.add(engine.world, [...blocks, ...pigs]);
}

function setupMouse() {
    const mouse = Mouse.create(render.canvas);
    mouseConstraint = MouseConstraint.create(engine, {
        mouse: mouse,
        constraint: {
            stiffness: 0.2,
            render: { visible: false }
        }
    });

    Composite.add(engine.world, mouseConstraint);
    render.mouse = mouse;

    Events.on(mouseConstraint, 'enddrag', (event) => {
        if (event.body === bird) {
            isLaunched = true;
            setTimeout(() => {
                slingshot.bodyB = null;
            }, 60);
        }
    });
}

function checkBirdOutOfBounds() {
    if (!bird) return;

    const pos = bird.position;
    // 小鳥飛出螢幕範圍邊界時，立刻重新生成新鳥
    const isOutOfBounds = pos.x < -50 || pos.x > width + 50 || pos.y < -100 || pos.y > height + 50;
    
    if (isLaunched && isOutOfBounds) {
        reloadBird();
    }
}

function reloadBird() {
    Composite.remove(engine.world, bird);
    slingshot.bodyB = null;
    spawnBird();
}

function handleCollisions(event) {
    event.pairs.forEach(pair => {
        const { bodyA, bodyB } = pair;
        [bodyA, bodyB].forEach(body => {
            if (body.label === 'pig' && body.speed > 3) {
                Composite.remove(engine.world, body);
                score += 100;
                scoreEl.innerText = score;
            }
        });
    });
}

function resizeCanvas() {
    const canvas = render.canvas;
    const containerWidth = container.clientWidth;
    const containerHeight = container.clientHeight;
    
    canvas.style.width = `${containerWidth}px`;
    canvas.style.height = `${containerHeight}px`;
}

function resetGame() {
    setupScene();
}

window.onload = init;
</script>
</body>
</html>
